version: 2

project_name: beacon

builds:
  - id: beacon-unix
    main: ./cmd/beacon
    binary: beacon
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tanzir71/beacon/internal/version.Version={{.Version}} -X github.com/tanzir71/beacon/internal/version.Commit={{.Commit}}

  - id: beacon-windows
    main: ./cmd/beacon
    binary: beacon
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    tags:
      - tray
    flags:
      - -trimpath
    ldflags:
      - -s -w -H=windowsgui -X github.com/tanzir71/beacon/internal/version.Version={{.Version}} -X github.com/tanzir71/beacon/internal/version.Commit={{.Commit}}

  - id: beacon-cli-windows
    main: ./cmd/beacon
    binary: beacon-cli
    env:
      - CGO_ENABLED=0
    goos:
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/tanzir71/beacon/internal/version.Version={{.Version}} -X github.com/tanzir71/beacon/internal/version.Commit={{.Commit}}

archives:
  - id: unix
    ids:
      - beacon-unix
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

  - id: windows
    ids:
      - beacon-windows
      - beacon-cli-windows
    formats:
      - zip
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    wrap_in_directory: true
    files:
      - LICENSE
      - README.md

nfpms:
  - id: linux-packages
    ids:
      - beacon-unix
    package_name: beacon
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    vendor: Beacon contributors
    homepage: https://github.com/tanzir71/beacon
    maintainer: Beacon contributors
    description: A friendly local app server that turns folders into websites.
    license: MIT
    formats:
      - deb
      - rpm
    bindir: /usr/bin

sboms:
  - id: archive-sboms
    artifacts: archive
  - id: package-sboms
    artifacts: package

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "0.0.0-next"

changelog:
  use: git
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  draft: true
